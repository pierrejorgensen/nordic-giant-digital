  <form id="second-opinion-form{{suffix}}" class="contact-form" action="https://formspree.io/f/{% env FORMSPREE_FORM_ID_SECOND_OPINION your_second_opinion_form_id_here %}" method="POST">
    <label for="name{{suffix}}">Name</label>
    <input id="name{{suffix}}" name="name" type="text" required autocomplete="name">

    <label for="email{{suffix}}">Email</label>
    <input id="email{{suffix}}" name="email" type="email" required autocomplete="email">

    <label for="url{{suffix}}">Link (URL)</label>
    <input id="url{{suffix}}" name="url" type="url" required autocomplete="url" inputmode="url">

    <label for="message{{suffix}}">Anything else we should know?</label>
    <textarea id="message{{suffix}}" name="message" required></textarea>

    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
    <textarea name="_autoresponse" hidden aria-hidden="true">
      We got your message.

      Your second opinion is on its way shortly. We'll review from a customer's point of view and get back to you with 3-4 tips you can take action on.

      Best,
      Nordic Giant Digital
      https://nordicgiantdigital.com/
    </textarea>
    <button type="submit">Send it over</button>
  </form>

  <p id="form-status{{suffix}}" class="form-status" hidden role="status"></p>
