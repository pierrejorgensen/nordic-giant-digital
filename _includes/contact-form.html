  <form id="contact-form{{suffix}}" class="contact-form" action="https://formspree.io/f/{% env FORMSPREE_FORM_ID your_form_id_here %}" method="POST">
    <label for="name{{suffix}}">Name</label>
    <input id="name{{suffix}}" name="name" type="text" required autocomplete="name">

    <label for="email{{suffix}}">Email</label>
    <input id="email{{suffix}}" name="email" type="email" required autocomplete="email">

    <label for="message{{suffix}}">How can we help you?</label>
    <textarea id="message{{suffix}}" name="message" required></textarea>

    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
    <textarea name="_autoresponse" hidden aria-hidden="true">Thanks for reaching out to Nordic Giant Digital.

We've received your message and will get back to you "straks". In other words, in English, shortly.

Best,
Nordic Giant Digital
https://nordicgiantdigital.com</textarea>
    <button type="submit">Let's figure it out</button>
  </form>

  <p id="form-status{{suffix}}" class="form-status" hidden role="status"></p>
