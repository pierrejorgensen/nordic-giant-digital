<section id="contact" class="prose">
  <h2>Contact us</h2>
  <p>Tell us about your project. We&rsquo;ll get back to you shortly.</p>

  <p>Phone number and LinkedIn profile links?</p>

  <form id="contact-form" class="contact-form" action="https://formspree.io/f/{% env FORMSPREE_FORM_ID your_form_id_here %}" method="POST">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
    <button type="submit">Send message</button>
  </form>

  <p id="form-status" class="form-status" hidden role="status"></p>
</section>
